/* Layout: 폰 한 대 크기의 앱 화면. 아래만 둥근 컬러 헤더 띠 + 그림자 카드 + 파스텔 타일 (디자인 시안 v2) */
:root{
  --page:#F3B394; --app:#FFFFFF; --card:#FFFFFF; --soft:#F6EFE9; --ink:#2D3B5A; --muted:#737B92; --faint:#C3C7D3; --line:#EFE6DE;
  --teal:#559F95; --mustard:#EDAA4A; --salmon:#F2A88B; --sky:#A8C0E0; --navy:#2D3B5A; --peach:#F9D5C2; --mint:#A6D0C8;
  --salmon-d:#E08E70; --brown:#C48A5E; --brown-d:#A8714A; --art-white:#FFFFFF;
  --on-tile:#2D3B5A; --on-teal:#FFFFFF; --on-navy:#FFFFFF; --on-peach:#2D3B5A;
  --btn:#3F8C83; --on-btn:#FFFFFF; --accent-text:#2F7A71; --mint-soft:#E2F0ED;
  --danger:#C9533B; --yt:#D93025;
  --hero-bg:#FFFFFF; --hero-line:#F5B99A; --hello:#6E6E73;
  --shadow:0 4px 14px rgba(45,59,90,.08); --shadow-hi:0 10px 26px rgba(45,59,90,.16);
  --body:"Pretendard","Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --brand:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#11141C; --app:#1A1F2C; --card:#242A3A; --soft:#2A3142; --ink:#EEF0F6; --muted:#A7AEC3; --faint:#566079; --line:#343B4F;
  --navy:#3B4B72; --peach:#4A3833; --on-peach:#F8E2D6; --mint-soft:#21393A; --accent-text:#7FD0C4; --btn:#4FA095;
  --danger:#F08A70; --yt:#FF6B5E; --art-white:#F4F1EC; --hero-bg:#242A3A; --hero-line:#B9806A; --hello:#C9CCD6;
  --shadow:0 4px 14px rgba(0,0,0,.3); --shadow-hi:0 10px 26px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#11141C; --app:#1A1F2C; --card:#242A3A; --soft:#2A3142; --ink:#EEF0F6; --muted:#A7AEC3; --faint:#566079; --line:#343B4F;
  --navy:#3B4B72; --peach:#4A3833; --on-peach:#F8E2D6; --mint-soft:#21393A; --accent-text:#7FD0C4; --btn:#4FA095;
  --danger:#F08A70; --yt:#FF6B5E; --art-white:#F4F1EC; --hero-bg:#242A3A; --hero-line:#B9806A; --hello:#C9CCD6;
  --shadow:0 4px 14px rgba(0,0,0,.3); --shadow-hi:0 10px 26px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:12px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent-text)}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--app);display:flex;flex-direction:column}
#screen{flex:1;min-width:0}
@media (min-width:560px){body{padding-block:24px}.app{border-radius:32px;box-shadow:0 20px 60px rgba(90,40,20,.18);min-height:calc(100vh - 48px);overflow:clip}}

/* 헤더 띠 */
.bar{padding:12px 16px 18px;border-radius:0 0 28px 28px;display:grid;gap:12px}
.barrow{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;align-items:center}
.barrow h1{font-size:18px;font-weight:900;text-align:center}
.icon-btn{width:36px;height:36px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:inherit;padding:0}
.icon-btn svg{width:22px;height:22px}
.icon-btn.flip svg{transform:rotate(180deg)}
.t-teal{background:var(--teal);color:var(--on-teal)}
.t-peach{background:var(--peach);color:var(--on-peach)}
.t-navy{background:var(--navy);color:var(--on-navy)}
.t-sky{background:var(--sky);color:var(--on-tile)}
.t-mustard{background:var(--mustard);color:var(--on-tile)}
.t-plain{background:transparent;color:var(--ink);padding-bottom:4px}
.hero{padding:12px 16px 0;border-radius:0 0 32px 32px;overflow:hidden}
.herorow{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.hero h1{font-size:22px;font-weight:900;line-height:1.35;margin-bottom:26px}
.art-plant{width:112px;height:112px;flex:none;margin-bottom:-4px}

/* 홈 머리: 흰 바탕 + 파스텔 장식 + 아래 둥근 피치색 선 */
.hero2{position:relative;overflow:hidden;background:var(--hero-bg);padding:12px 16px 26px;display:grid;justify-items:center;gap:8px;text-align:center}
.hero2 .barrow{position:relative;z-index:1;justify-self:stretch}
.hero2 .deco{position:absolute;pointer-events:none;opacity:.9}
.ring-blue{width:130px;height:130px;border-radius:50%;border:30px solid #B8DDE8;left:-54px;top:-58px}
.arc-mint{width:300px;height:300px;border-radius:50%;border:22px solid #C6E5DA;border-right-color:transparent;border-top-color:transparent;right:-200px;top:-250px;transform:rotate(10deg)}
.wave-lav{width:60px;height:110px;left:-6px;bottom:-14px}
.wave-lav path{stroke:#D3D0EA}
.ring-peach{width:84px;height:84px;border-radius:50%;border:20px solid #F8D3A3;right:-36px;bottom:-30px}
.flower{width:18px;height:18px;right:58px;bottom:34px}
.flower g{fill:#7FC3D6}.flower .fc{fill:var(--hero-bg)}
.hero-logo1{position:relative;z-index:1;width:min(194px,53%);height:auto;margin-top:4px}
.hello{position:relative;z-index:1;font-size:13px;font-weight:400;font-family:"Jua Hello","Noto Sans KR",sans-serif;color:var(--hello);letter-spacing:.01em}
.hello .heart{color:#D97F9E;font-size:10.5px;margin-left:3px;vertical-align:2px}
.hero-logo{width:150px;max-width:44%;height:auto;flex:none;margin:0 4px 22px 0}

.pad{padding:16px}
.stack{display:grid;gap:14px}
.stack-s{display:grid;gap:8px}
.center{text-align:center}
.lead{text-align:center;font-weight:700;font-size:13px}
.note{font-size:12px;color:var(--muted)}
.hint{font-size:11px;color:var(--muted)}
.sec-t{font-size:14px;font-weight:700}
.sec-t .note{font-weight:400;font-size:11px;margin-left:4px}
.cnt{display:inline-block;min-width:18px;padding:0 7px;border-radius:999px;background:var(--mustard);color:var(--on-tile);font-size:11px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.rowhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card-w{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;min-width:0}
.empty{padding:26px 16px;text-align:center;color:var(--muted);background:var(--card);border-radius:16px;box-shadow:var(--shadow);display:grid;gap:10px;justify-items:center;font-size:12px}
.empty b{color:var(--ink);font-size:14px}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 16px;border:0;border-radius:999px;background:var(--soft);color:var(--ink);font-size:12px;font-weight:700;white-space:nowrap;text-decoration:none}
.btn.small{height:28px;padding:0 12px}
.btn.primary{background:var(--btn);color:var(--on-btn)}
.btn.primary.on{background:var(--card);color:var(--accent-text);box-shadow:inset 0 0 0 1.5px var(--btn)}
.btn.navy{background:var(--navy);color:var(--on-navy)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--danger)}
.btn.block{width:100%;height:40px;font-size:13px}
.btn.grow{flex:1}
.btn.wide{padding:0 24px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:14px;height:14px}

/* 홈 */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;aspect-ratio:1/1;max-width:100%;border:0;border-radius:16px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:1px;overflow:hidden}
.tile .tl{font-weight:700;font-size:13px}
.tile small{font-size:11px;opacity:.85}
.tile .art{position:absolute;right:10px;bottom:10px;width:56%}
.tile .art svg{width:100%;height:auto;display:block}
.tile .art.a-cal{width:52%;right:12px;bottom:12px}
.tile .art.a-kit{width:70%;right:8px;bottom:8px}
.tile .art.a-books{width:90%;left:5%;right:auto;bottom:10px}
.tile .art.a-prog{width:62%;right:12px;bottom:10px}
.nextcard{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;border:0;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;text-align:left}
.nc-ico{width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--c) 45%,var(--peach));display:grid;place-items:center;font-size:22px}
.nc-tx{display:grid;min-width:0}
.nc-tx small{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nc-tx b{font-size:14px}
.go{font-size:20px;color:var(--muted)}

/* 재료 카테고리 */
.catcard{position:relative;display:block;width:100%;height:100px;border:0;border-radius:16px;background:var(--navy);color:var(--on-navy);text-align:right;padding:12px 16px;overflow:hidden}
.catcard b{display:block;font-size:14px}
.catcard small{display:block;font-size:11px;opacity:.8}
.catcard .art{position:absolute;left:12px;bottom:-4px;width:112px}
.catcard .art svg{width:100%;height:auto;display:block}

/* 찾기·칩 */
.hsearch,.search{display:flex;align-items:center;gap:8px;background:var(--app);color:var(--ink);border-radius:999px;padding:0 14px;height:40px;box-shadow:var(--shadow)}
.search{background:var(--card)}
.hsearch svg,.search svg{width:16px;height:16px;flex:none;color:var(--muted)}
.hsearch input,.search input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;outline:none;padding:0}
.chipscroll{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.chipscroll::-webkit-scrollbar{display:none}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chip{flex:none;border:0;border-radius:999px;background:var(--soft);color:var(--ink);font-size:12px;font-weight:500;height:30px;padding:0 14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);font-weight:700}
.bar .chip{background:var(--app);color:var(--ink)}
.bar .chip[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
details.more summary{cursor:pointer;font-size:12px;font-weight:700;list-style:none;display:flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"▾";color:var(--muted)}
details.more[open] summary::after{content:"▴"}
details.more>.chiprow{margin-top:8px}
.resbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ghead{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-top:4px}
.combo{background:var(--mint-soft);border-radius:16px;padding:12px 14px;display:grid;gap:6px}
.combohead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.combohead b{font-size:13px}
.combochips{display:flex;align-items:center;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.cchip{border:0;background:var(--navy);color:var(--on-navy);border-radius:999px;height:28px;padding:0 12px;font-weight:700;font-size:12px}
.combochips .plus{font-weight:900}

/* 프로그램 카드 */
.plist{display:grid;gap:10px}
.pcard{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:10px;display:grid;gap:6px;min-width:0}
.pc-open{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;border:0;background:none;padding:0;text-align:left;width:100%}
.pc-art{position:relative;width:72px;height:72px;border-radius:14px;background:color-mix(in srgb,var(--c) 38%,var(--peach));display:grid;place-items:center;overflow:hidden;font-size:34px}
.pc-art img{width:100%;height:100%;object-fit:cover}
.kitbadge{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:700;background:var(--navy);color:var(--on-navy);border-radius:999px;padding:0 6px;line-height:16px}
.pc-tx{display:grid;gap:3px;min-width:0}
.pc-tx b{font-size:14px;font-weight:700}
.pc-tx small{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kinds{display:flex;flex-wrap:wrap;gap:4px}
.kinds span{font-size:11px;font-weight:500;color:var(--accent-text);background:var(--mint-soft);border-radius:999px;padding:0 8px}
.pc-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-left:84px;min-width:0}
.pc-foot .meta{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.srcmark{font-size:10px;font-weight:500;color:var(--accent-text);background:var(--mint-soft);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:2px}

/* 그림책 */
.modetiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mtile{position:relative;height:96px;border:0;border-radius:16px;padding:12px;text-align:left;overflow:hidden;opacity:.62}
.mtile[aria-pressed="true"]{opacity:1;box-shadow:var(--shadow-hi)}
.mtile .tl{font-size:13px;font-weight:700}
.mtile .art{position:absolute;right:10px;bottom:8px;width:56px}
.mtile .art svg{width:100%;height:auto;display:block}
.blist{display:grid;gap:10px}
.bookcard{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:4px 12px;align-items:center;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px}
.bk-open{display:grid;gap:2px;border:0;background:none;padding:0;text-align:left;min-width:0}
.bk-open b{font-size:13px}
.bk-open small{font-size:11px;color:var(--muted)}
.bk-open .why{font-size:11px;color:var(--accent-text);font-weight:500}
.bk-art{width:48px;height:48px;border-radius:50%;background:color-mix(in srgb,var(--c) 45%,var(--peach));display:grid;place-items:center;font-size:24px}
.bookcard .ytlink{grid-column:1/-1}

/* 달력 */
.calhead{display:flex;justify-content:space-between;align-items:center}
.calhead b{font-size:14px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px 0;text-align:center}
.dow{font-size:11px;color:var(--muted);padding:2px 0}
.day{width:36px;height:36px;margin:0 auto;border:0;background:none;border-radius:50%;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink);display:grid;place-items:center;padding:0}
.day.out{color:var(--faint)}
.day.has{background:var(--tone);color:var(--on-tile);font-weight:700}
.day.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.day[aria-pressed="true"]{outline:2px solid var(--navy);outline-offset:2px}
.calpanel{position:relative;background:var(--peach);color:var(--on-peach);border-radius:28px 28px 0 0;padding:22px 16px 20px;display:grid;gap:8px;margin-top:4px}
.fab{position:absolute;top:-18px;right:22px;width:36px;height:36px;border:0;border-radius:50%;background:var(--btn);color:var(--on-btn);display:grid;place-items:center;box-shadow:var(--shadow-hi);padding:0}
.fab svg{width:18px;height:18px}
.evrow{display:grid;grid-template-columns:10px minmax(0,1fr);column-gap:10px;align-items:center;width:100%;border:0;background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;text-align:left;box-shadow:var(--shadow)}
.evrow .dot{grid-row:span 2;width:10px;height:10px;border-radius:50%;background:var(--tone)}
.evrow b{font-size:13px}
.evrow small{font-size:11px;color:var(--muted)}

/* 수업 */
.stats{display:flex;justify-content:center;gap:28px;text-align:center}
.stats span{display:grid}
.stats small{font-size:11px;opacity:.75}
.stats b{font-size:14px;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--app);border-radius:999px;padding:3px;box-shadow:inset 0 0 0 1.5px var(--navy)}
.seg button{height:30px;border:0;border-radius:999px;background:none;font-weight:700;font-size:12px;color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--navy);color:var(--on-navy)}
.cname{text-align:center;display:grid;gap:2px}
.cname h2{font-size:18px;font-weight:900}
.cname small{font-size:11px;color:var(--muted)}
.wktiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wktile{position:relative;aspect-ratio:1/1;max-width:100%;border:0;border-radius:14px;padding:10px;text-align:left;overflow:hidden;background:var(--tone);color:var(--tt);display:flex;flex-direction:column}
.wktile span:first-child{font-size:12px;font-weight:700}
.wktile small{font-size:11px;opacity:.85}
.wkico{position:absolute;right:8px;bottom:8px;width:38px;height:38px;border-radius:50%;background:var(--art-white);display:grid;place-items:center;font-size:20px}
.prog3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));text-align:center;gap:8px;margin-top:10px}
.prog3 span{display:grid}
.prog3 small{font-size:11px;color:var(--muted)}
.prog3 b{font-size:14px;font-variant-numeric:tabular-nums}
.rowlink{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 14px;border:0;background:var(--card);border-radius:12px;box-shadow:var(--shadow);font-weight:700;font-size:12px;color:var(--ink);text-align:left;cursor:pointer}
.rowlink span{color:var(--muted);font-weight:400}
details.rowdet>summary{list-style:none}
details.rowdet>summary::-webkit-details-marker{display:none}
details.rowdet .tblwrap{margin-top:8px}
.datestrip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.datestrip::-webkit-scrollbar{display:none}
.dchip{flex:none;width:46px;height:52px;border:0;border-radius:12px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);display:grid;place-content:center;line-height:1.2;padding:0}
.dchip b{font-size:14px;font-variant-numeric:tabular-nums}
.dchip small{font-size:11px;color:var(--muted)}
.dchip[aria-current="true"]{background:var(--salmon);color:var(--on-tile)}
.dchip[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.dchip[aria-current="true"] small,.dchip[aria-pressed="true"] small{color:inherit;opacity:.85}
.bigweek{display:grid;gap:2px;width:100%;min-height:88px;border:0;border-radius:14px;padding:12px 14px;text-align:left;color:var(--on-tile);background:var(--tone)}
.bigweek.past{opacity:.6}
.bw-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.bigweek b{font-size:13px}
.bigweek small{font-size:11px;opacity:.85}
.bigweek .when{margin-top:6px}
.tag{flex:none;font-size:10px;font-weight:700;background:var(--art-white);color:var(--on-tile);border-radius:999px;padding:0 8px;line-height:18px}
.addweek{display:flex;align-items:center;gap:6px;border:0;background:none;font-weight:700;font-size:12px;color:var(--ink);padding:4px 0}
.addweek svg{width:16px;height:16px}

/* 주차 준비 */
.wprog{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--card);border:0;border-radius:16px;box-shadow:var(--shadow);padding:10px 12px}
.wprog .tx{flex:1;min-width:0;display:grid}
.wprog b{font-size:14px}
.wprog small{font-size:11px;color:var(--muted)}
.mini{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:24px;overflow:hidden}
.mini img{width:100%;height:100%;object-fit:cover}
.wmemo{font-size:12px;background:color-mix(in srgb,var(--mustard) 22%,var(--card));border-radius:12px;padding:8px 12px}
.checks{list-style:none;margin:6px 0 0;padding:0;display:grid}
.checks label{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer}
.checks li:last-child label{border-bottom:0}
.checks input{appearance:none;-webkit-appearance:none;width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--teal);margin:0;flex:none;cursor:pointer;background:transparent}
.checks input:checked{background:var(--teal);box-shadow:inset 0 0 0 1.5px var(--teal),inset 0 0 0 4px var(--card)}
.checks input:disabled{cursor:default;opacity:.6}
.checks .nm{flex:1;min-width:0}
.checks input:checked~.nm{color:var(--muted);text-decoration:line-through}
.checks .q{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ringcard{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center}
.ringcard span{display:grid}
.ringcard b{font-size:14px}
.ringcard small{font-size:11px;color:var(--muted)}
.ring{width:64px;height:64px}
.rg-bg{fill:none;stroke:var(--soft);stroke-width:7}
.rg-fg{fill:none;stroke:var(--teal);stroke-width:7;stroke-linecap:round}
.ring text{font-size:12px;font-weight:700;fill:var(--ink);font-family:var(--body)}
.extend{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exttile{display:grid;justify-items:center;gap:6px;border:0;border-radius:16px;padding:14px 10px 12px;text-align:center}
.exttile .art{width:44px}
.exttile .art svg{width:100%;height:auto;display:block}
.exttile small{font-size:11px;font-weight:500}

/* 고르기·확인 */
.stepper{display:flex;justify-content:center;gap:16px;font-size:11px;color:var(--muted)}
.stepper span{display:flex;align-items:center;gap:4px}
.stepper i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--soft);font-style:normal;font-weight:700;font-size:10px}
.stepper .on{color:var(--ink);font-weight:700}
.stepper .on i{background:var(--navy);color:var(--on-navy)}
.stepper .done i{background:var(--teal);color:var(--on-teal)}
.pickcard{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;display:grid;gap:8px}
.pk-open{display:grid;gap:2px;border:0;background:none;padding:0;text-align:left}
.pk-open b{font-size:13px}
.pk-open small{font-size:11px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pickcard .btn{justify-self:end}
.selcard{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;background:var(--navy);color:var(--on-navy);border-radius:16px;padding:12px}
.sc-ico{width:64px;height:64px;border-radius:12px;background:var(--mustard);display:grid;place-items:center;font-size:32px}
.selcard .tx{display:grid;min-width:0}
.selcard small{font-size:11px;opacity:.8}
.selcard b{font-size:14px}
.mapbox{position:relative;border-radius:14px;overflow:hidden;height:120px}
.mapbox svg{width:100%;height:100%;display:block}
.place{position:absolute;left:10px;top:10px;font-size:11px;font-weight:700;background:var(--card);color:var(--ink);border-radius:8px;padding:2px 8px;box-shadow:var(--shadow);max-width:calc(100% - 20px)}
.countrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding-top:4px}
.countrow span{display:grid}
.countrow small{font-size:11px;color:var(--muted)}
.countrow b{font-size:18px;font-weight:900}

/* 키트 */
.kitlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.kitlist li{display:flex;align-items:center;gap:10px;padding:8px;background:var(--soft);border-radius:12px}
.kitlist .mini{width:36px;height:36px;font-size:20px;border-radius:10px}
.kitlist li.note{display:grid;gap:8px;justify-items:start;background:none;padding:4px 0}
.kitlist .nm{flex:1;min-width:0;font-size:13px;font-weight:500}
.kitlist .nm small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.kids{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.stepper2{display:inline-flex;align-items:center;gap:4px}
.stepper2 button{width:34px;height:34px;border:0;background:var(--soft);border-radius:12px;font-size:16px}
.stepper2 input{width:64px;padding:6px;border:0;border-radius:12px;background:var(--soft);color:var(--ink);font:inherit;font-size:16px;text-align:center;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
table.tot{width:100%;border-collapse:collapse;font-size:12px}
table.tot th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.04em;border-bottom:1px solid var(--line);padding:6px 4px}
table.tot td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.tot td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tot .from{font-size:11px;color:var(--muted)}
table.tot tr.done td:not(.c){text-decoration:line-through;color:var(--muted)}
table.tot td.c{width:28px}
table.tot input{width:18px;height:18px;accent-color:var(--teal)}
.subhead{font-size:13px;font-weight:700;margin-top:4px}

/* 상세 시트 */
.scrim{position:fixed;inset:0;background:rgba(15,18,28,.45);z-index:20}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;top:calc(36px + env(safe-area-inset-top,0px));width:min(480px,100%);background:var(--app);border-radius:28px 28px 0 0;z-index:21;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet .hero2{position:relative}
.pic{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;overflow:hidden;display:grid;place-items:center;border-radius:28px 28px 0 0}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .glyph{font-size:72px;line-height:1}
.pic.plain::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.35) 1.2px,transparent 1.3px);background-size:12px 12px}
.sheet .close{position:absolute;top:12px;right:12px;z-index:2;border:0;background:var(--app);color:var(--ink);border-radius:50%;width:36px;height:36px;font-size:16px;box-shadow:var(--shadow)}
.thumbs{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto}
.thumbs button{border:2px solid transparent;padding:0;border-radius:8px;overflow:hidden;width:64px;height:48px;flex:none;background:var(--line)}
.thumbs button[aria-current="true"]{border-color:var(--teal)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.headline{padding:14px 16px 4px;display:grid;gap:6px}
.headline h2{font-size:18px;font-weight:900}
.tech{font-size:12px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags span{font-size:11px;background:var(--soft);border-radius:999px;padding:1px 9px}
.tags span.k{color:var(--accent-text);background:var(--mint-soft);font-weight:500}
.sec{padding:12px 16px;display:grid;gap:8px}
.sec h3{font-size:14px;font-weight:700}
.sec h3 .note{font-weight:400;font-size:11px}
.bookbox{background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:12px 14px;display:grid;gap:3px}
.bookbox .t{font-weight:700;font-size:13px}
.bookbox .a{font-size:11px;color:var(--muted)}
.bookbox .n{font-size:12px}
.ytlink{justify-self:start;display:inline-flex;align-items:center;gap:6px;height:30px;margin-top:4px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:700;color:var(--yt);box-shadow:inset 0 0 0 1.5px var(--yt);text-decoration:none}
.ytlink::before{content:"▶";font-size:9px}
.ytlink small{color:var(--muted);font-weight:400;font-size:11px}
ol.steps{margin:0;padding-left:1.3em;display:grid;gap:6px;font-size:13px}
ul.mats{list-style:none;margin:0;padding:0;display:grid}
ul.mats li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}
ul.mats .q{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
ul.ideas{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:12px}
.tip{background:color-mix(in srgb,var(--mustard) 22%,var(--card));border-radius:16px;padding:10px 14px;font-size:12px}
.related{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:420px){.related{grid-template-columns:1fr}}
.rel{display:flex;gap:10px;align-items:center;text-align:left;background:var(--card);border:0;box-shadow:var(--shadow);border-radius:14px;padding:8px;min-width:0}
.rel .tx{min-width:0;display:grid}
.rel b{font-weight:700;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel small{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel .why{font-size:11px;color:var(--accent-text)}
.actions{position:sticky;bottom:0;background:var(--app);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;box-shadow:0 -6px 18px rgba(45,59,90,.08)}
.actions .btn{height:36px}
ul.extras{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.extras label{display:flex;gap:10px;align-items:flex-start;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:10px 12px;cursor:pointer}
ul.extras input{margin-top:3px;width:18px;height:18px;accent-color:var(--teal);flex:none}
ul.extras .et{display:grid;gap:2px;min-width:0}
ul.extras b{font-weight:700;font-size:12px}
ul.extras small{font-size:11px;color:var(--muted)}
.etag{justify-self:start;font-size:10px;color:var(--accent-text);background:var(--mint-soft);border-radius:999px;padding:0 7px}
.flow{background:color-mix(in srgb,var(--sky) 24%,var(--card));border-radius:16px;padding:12px 14px;display:grid;gap:8px}
.flowhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:700}
.flowhead b{font-variant-numeric:tabular-nums}
.flowhead small{font-size:11px;color:var(--muted);font-weight:400}
.flow ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.flow li{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;font-size:12px;padding:5px 0;border-bottom:1px solid var(--line)}
.flow li.plus{color:var(--accent-text)}
.flow .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}

/* 편집 화면 */
.banner{background:color-mix(in srgb,var(--mustard) 24%,var(--card));border-radius:16px;padding:10px 14px;font-size:12px}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:60vh;overflow-y:auto}
.mlist button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;border-radius:12px;padding:6px 8px;font-size:12px}
.mlist button:hover{background:var(--soft)}
.mlist .mini{width:32px;height:32px;font-size:18px;border-radius:8px}
.mlist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mlist .st{font-size:11px;color:var(--muted)}
.form{display:grid;gap:12px}
.form fieldset{border:0;background:var(--soft);border-radius:16px;padding:12px 14px;margin:0;display:grid;gap:10px;min-width:0}
.form legend{float:left;width:100%;font-size:14px;font-weight:700;padding:0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.fld{display:grid;gap:4px;min-width:0}
.fld>span{font-size:11px;color:var(--muted)}
.fld>span.sec-t{font-size:14px;color:var(--ink)}
.fld input,.fld select,.fld textarea,.inp{width:100%;min-width:0;padding:7px 12px;border:0;border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;box-shadow:inset 0 0 0 1px var(--line)}
.fld textarea{resize:vertical;min-height:80px;line-height:1.55}
.fld input[type=color]{padding:2px;height:38px}
.bookrow{display:grid;gap:8px;padding:10px;background:var(--card);border-radius:14px}
.matrow{display:grid;grid-template-columns:minmax(0,1fr) 60px 60px auto auto;gap:6px;align-items:center}
.matrow label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}
@media (max-width:440px){.matrow{grid-template-columns:minmax(0,1fr) 54px 54px}}
.x{border:0;background:none;color:var(--muted);font-size:18px;width:28px;height:28px;padding:0}
.imgs{display:flex;flex-wrap:wrap;gap:8px}
.imgs figure{margin:0;position:relative;width:110px;max-width:100%}
.imgs img{width:110px;height:84px;object-fit:cover;border-radius:10px;display:block;border:2px solid transparent}
.imgs figure.cover img{border-color:var(--teal)}
.imgs figcaption{display:flex;justify-content:space-between;font-size:11px;margin-top:2px}
.imgs figcaption button{border:0;background:none;padding:0;color:var(--muted);font-size:11px}
.upload{position:relative;display:grid;place-items:center;width:110px;height:84px;border:2px dashed var(--faint);border-radius:12px;color:var(--muted);font-size:12px;text-align:center;cursor:pointer}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.relpick{display:flex;flex-wrap:wrap;gap:6px}
.formbar{position:sticky;bottom:0;background:var(--card);margin:0 -14px -14px;padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-radius:0 0 16px 16px;box-shadow:0 -6px 18px rgba(45,59,90,.06)}
.formbar .sp{flex:1}
.srow{display:grid;grid-template-columns:48px 150px minmax(0,1fr) auto;gap:6px;align-items:center;padding:8px;background:var(--card);border-radius:14px}
.srow .wn{font-size:12px;font-weight:700}
.srow input,.srow select{width:100%;min-width:0;padding:6px 8px;border:0;border-radius:10px;background:var(--soft);color:var(--ink);font:inherit;font-size:16px}
.srow .sm{grid-column:2/-1}
.srow .ctl{display:flex;gap:2px}
@media (max-width:520px){.srow{grid-template-columns:44px minmax(0,1fr)}.srow select,.srow .sm,.srow .ctl{grid-column:1/-1}}

/* 메뉴 서랍·탭 막대 */
.dscrim{position:fixed;inset:0;background:rgba(15,18,28,.4);z-index:40}
.drawer{position:fixed;top:0;bottom:0;left:max(0px,calc(50% - 240px));width:min(290px,84vw);background:var(--app);z-index:41;padding:calc(22px + env(safe-area-inset-top,0px)) 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;box-shadow:8px 0 30px rgba(0,0,0,.18);overflow-y:auto}
.dr-head{display:grid;gap:2px;justify-items:start;padding-left:12px}
.dr-head svg{width:52px;height:52px;margin-bottom:6px}
.dr-head b{font-size:14px}
.dr-head small{font-size:11px;color:var(--muted)}
.drawer ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.drawer li button{border:0;background:none;font-size:13px;font-weight:500;color:var(--ink);padding:8px 14px;border-radius:999px;text-align:left}
.drawer li button[aria-current="page"]{background:var(--mustard);color:var(--on-tile);font-weight:700}
.dr-brand{margin-top:auto;padding-left:12px;font-family:var(--brand);font-size:20px;line-height:1.3;color:var(--salmon-d)}

/* ---------- 수업 계획서 워드(.docx) 만들기 ---------- */
function courseDocx(JSZip,c,progs,madeOn){
  const X=s=>String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&apos;"}[ch])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
  const DW="일월화수목금토";
  const pd=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null};
  const fd=s=>{const d=pd(s);return d?`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${DW[d.getDay()]})`:"날짜 미정"};
  const fs=s=>{const d=pd(s);return d?`${d.getMonth()+1}/${d.getDate()} (${DW[d.getDay()]})`:"미정"};
  const num=n=>String(+(+n).toFixed(1));
  const TEAL="3F8C83",NAVY="2D3B5A",MUTED="6B7287",HEAD="E2F0ED",SOFT="F6EFE9";
  const W=9638;   // A4, 좌우 여백 2cm

  /* 문단·표 조각 */
  const run=(t,o={})=>`<w:r><w:rPr>${o.b?"<w:b/>":""}${o.color?`<w:color w:val="${o.color}"/>`:""}${o.sz?`<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>`:""}</w:rPr><w:t xml:space="preserve">${X(t)}</w:t></w:r>`;
  const P=(parts,o={})=>{
    const runs=(Array.isArray(parts)?parts:[{t:parts}]).map(p=>typeof p==="string"?run(p,o):run(p.t,{...o,...p})).join("");
    return `<w:p><w:pPr>${o.style?`<w:pStyle w:val="${o.style}"/>`:""}${o.keep?"<w:keepNext/>":""}${o.pageBreak?"<w:pageBreakBefore/>":""}${o.after!=null?`<w:spacing w:after="${o.after}"/>`:""}${o.ind?`<w:ind w:left="${o.ind}" w:hanging="${o.hang||0}"/>`:""}${o.align?`<w:jc w:val="${o.align}"/>`:""}</w:pPr>${runs}</w:p>`;
  };
  const cell=(content,w,o={})=>{
    const paras=(Array.isArray(content)?content:String(content??"").split("\n")).map(x=>typeof x==="string"&&!x.startsWith("<w:p")?P([{t:x}],{b:o.b,color:o.color,align:o.align,after:0}):x).join("")||P("",{after:0});
    return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${o.fill?`<w:shd w:val="clear" w:color="auto" w:fill="${o.fill}"/>`:""}<w:vAlign w:val="center"/></w:tcPr>${paras}</w:tc>`;
  };
  const table=(widths,head,rows,o={})=>{
    const sum=widths.reduce((a,b)=>a+b,0);const ws=widths.map(w=>Math.round(w/sum*W));
    const tr=(cells,hdr)=>`<w:tr>${hdr?"<w:trPr><w:tblHeader/><w:cantSplit/></w:trPr>":"<w:trPr><w:cantSplit/></w:trPr>"}${cells.map((v,i)=>cell(v,ws[i],hdr?{b:true,fill:HEAD,color:NAVY}:{...(o.firstBold&&i===0?{b:true,fill:SOFT}:{}),...(o.right&&o.right.includes(i)?{align:"right"}:{})})).join("")}</w:tr>`;
    return `<w:tbl><w:tblPr><w:tblStyle w:val="Grid"/><w:tblW w:w="${W}" w:type="dxa"/><w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="60" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:bottom w:w="60" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${ws.map(w=>`<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>${head?tr(head,true):""}${rows.map(r=>tr(r,false)).join("")}</w:tbl>${P("",{after:120})}`;
  };

  /* 내용 */
  const ss=c.sessions;const ds=ss.map(s=>s.date).filter(Boolean).sort();
  const kids=+c.kids||10;
  const body=[];
  body.push(P(c.name+" 수업 계획서",{style:"Title"}));
  body.push(P([{t:`작성일 ${fd(madeOn)}`,color:MUTED}],{after:200}));
  body.push(P("수업 개요",{style:"H1"}));
  const progN=new Set(ss.map(s=>s.programId).filter(id=>progs[id])).size;
  body.push(table([1,3],null,[
    ["수업 이름",c.name],
    ["기간",ds.length?`${fd(ds[0])} ~ ${fd(ds[ds.length-1])}`:"날짜 미정"],
    ["주차",`${ss.length}주 · 프로그램 ${progN}개`],
    ["아이 수",`${kids}명`],
    ["장소·시간 메모",c.memo||"-"]
  ],{firstBold:true}));

  body.push(P("주차별 일정",{style:"H1"}));
  body.push(table([1,2.2,3,3.6,1.3],["주차","날짜","프로그램","연계 그림책","활동"],ss.map((s,i)=>{const t=progs[s.programId];const b=t&&t.books.find(x=>x.t);
    return [`${i+1}주차`,fs(s.date),t?t.title:"미정",b?`『${b.t}』 ${b.a||""}`:"-",t?`${t.time}분`:"-"]}),{right:[4]}));

  ss.forEach((s,i)=>{
    const t=progs[s.programId];
    body.push(P(`${i+1}주차 · ${fd(s.date)}`,{style:"H1",pageBreak:true}));
    if(!t){body.push(P("이 주차 프로그램이 아직 정해지지 않았어요."));if(s.memo)body.push(P([{t:"메모  ",b:true},{t:s.memo}]));return}
    body.push(P(t.title,{style:"H2"}));
    body.push(P([{t:`${t.kinds.join(" · ")}  |  ${t.tech||""}  |  ${t.age||""}  |  활동 ${t.time}분`,color:MUTED}],{after:160}));
    const books=t.books.filter(b=>b.t);
    if(books.length){body.push(P("연계 그림책",{style:"H3"}));
      books.forEach(b=>{body.push(P([{t:`『${b.t}』`,b:true},{t:b.a?`  ${b.a}`:"",color:MUTED}],{after:40}));if(b.n)body.push(P(b.n,{after:120}))});}
    const bk=books[0]?.t;
    const flow=[["도입","5분",bk?`『${bk}』 표지를 보고 무슨 이야기일지 예상하기`:"오늘 만들 작품과 관련된 경험 이야기 나누기"],
      ...(bk?[["그림책 읽기","8분",`『${bk}』 함께 읽기`]]:[]),
      ["미술 활동",`${t.time}분`,t.tech||t.title],["정리","5분","작품 소개하고 함께 정리하기"]];
    const total=flow.reduce((a,f)=>a+parseInt(f[1]),0);

function relatedOf(t,all){
  const authors=new Set(t.books.map(b=>b.a).filter(Boolean));
  const mats=new Set(t.mats.map(m=>m.n));
  const techWords=(t.tech||"").split(/[·\s]/).filter(w=>w.length>1);
  const picked=t.related.map(id=>all.find(x=>x.id===id)).filter(Boolean).map(x=>({t:x,why:"직접 연결"}));
  const scored=all.filter(x=>x.id!==t.id&&!t.related.includes(x.id)).map(x=>{
    let s=0,why=[];
    const sameAuthor=x.books.find(b=>authors.has(b.a));
    if(sameAuthor){s+=4;why.push(`같은 작가 ${sameAuthor.a}`)}
    if(x.area===t.area){s+=2;why.push(`같은 영역`)}
    if(x.season===t.season&&t.season!=="사계절"){s+=1.5;why.push(`같은 계절`)}
    if(techWords.some(w=>(x.tech||"").includes(w))){s+=2;why.push("비슷한 기법")}
    const shared=x.mats.filter(m=>mats.has(m.n)&&m.q).length;
    if(shared>=2){s+=shared*.5;why.push(`재료 ${shared}가지 겹침`)}
    return{t:x,s,why:why.slice(0,2).join(" · ")}}).filter(r=>r.s>0).sort((a,b)=>b.s-a.s);
  return[...picked,...scored].slice(0,4);
}

/* ---------- 화면 이동 ---------- */
const TOP=new Set(["home","browse","calendar","course","kit","cats","books","manage"]);
const hist=[];
let route=(()=>{const r=store.get("route",null);return r&&TOP.has(r.name)?{name:r.name,p:{}}:{name:"home",p:{}}})();
function go(name,p={},o={}){
  closeDrawer();
  if(o.root)hist.length=0;else if(!o.replace)hist.push(route);
  route={name,p};if(TOP.has(name))store.set("route",{name});
  draw();window.scrollTo(0,0);
}
function back(){route=hist.pop()||{name:"home",p:{}};draw();window.scrollTo(0,0)}
function draw(){
  const S=SCREENS[route.name]||SCREENS.home;
  $("#screen").innerHTML=S.html(route.p||{});
  if(S.bind)S.bind(route.p||{});
  renderTabbar();
}
function refresh(){
  renderTabbar();
  if(state.open&&!$("#sheet").hidden){const y=$("#sheet").scrollTop;openSheet(state.open,state.shot);$("#sheet").scrollTop=y}
  const n=route.name;
  if(n==="cedit"||n==="pick")return;
  if(n==="manage"&&$("#mlist")){renderMList();if(!draft)renderEditor();return}
  if(n==="browse"&&$("#results")){renderResults();return}
  if(n==="kit"&&$("#totals")){renderKit();return}
  const y=window.scrollY;draw();window.scrollTo(0,y);
}
const navKey=n=>({cats:"browse",books:"home",week:"course",pick:"course",cedit:"course",manage:"home"})[n]||n;
function renderTabbar(){
  const cur=navKey(route.name);const n=state.kit.filter(id=>byId(id)).length;
  $("#tabbar").innerHTML=[["home","홈",ico.home],["browse","프로그램",ico.grid],["calendar","달력",ico.cal],["course","수업",ico.book],["kit","키트",ico.box]]
    .map(([k,l,i])=>`<button type="button" data-go="${k}" data-root="1" ${cur===k?'aria-current="page"':""}>${i}<span>${l}</span>${k==="kit"&&n?`<em class="badge">${n}</em>`:""}</button>`).join("");
}
function openDrawer(){
  const items=[["home","홈"],["course","수업 확인"],["calendar","수업 달력"],["browse","프로그램 찾기"],["cats","재료 카테고리"],["books","이번 달 그림책"],["kit","키트 준비 목록"],...(cap.canEdit?[["manage","프로그램 관리"]]:[])];
  const cur=({week:"course",pick:"course",cedit:"course"})[route.name]||route.name;
  $("#drawer").innerHTML=`<div class="dr-head">${svg.avatar}<b>선생님</b><small>그림책 미술키트</small></div>
    <ul>${items.map(([n,l])=>`<li><button type="button" data-go="${n}" data-root="1" ${cur===n?'aria-current="page"':""}>${l}</button></li>`).join("")}</ul>
    ${canOfferInstall()?`<button class="btn primary" type="button" data-install style="align-self:flex-start">앱으로 설치하기</button>`:""}
    <p class="dr-brand">오늘도 즐거운<br>미술 시간!</p>`;
  $("#drawer").hidden=false;$("#dscrim").hidden=false;$("#drawer").querySelector("button").focus();
}
function closeDrawer(){$("#drawer").hidden=true;$("#dscrim").hidden=true}
$("#dscrim").onclick=closeDrawer;

const menuBtn=()=>`<button class="icon-btn" type="button" data-act="menu" aria-label="메뉴 열기">${ico.menu}</button>`;
const backBtn=()=>`<button class="icon-btn" type="button" data-act="back" aria-label="뒤로">${ico.back}</button>`;
function bar({title,tone="teal",left="back",right="",body=""}){
  return `<header class="bar t-${tone}"><div class="barrow">${left==="menu"?menuBtn():backBtn()}<h1>${esc(title)}</h1><span>${right}</span></div>${body}</header>`;
}
const tile=(to,label,tone,pic,sub="",cls="")=>`<button class="tile t-${tone}" type="button" data-go="${to}"><span class="tl">${label}</span>${sub?`<small>${esc(sub)}</small>`:""}<span class="art ${cls}" aria-hidden="true">${pic}</span></button>`;

/* 화면 어디서나 쓰는 버튼 */
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");if(a){if(a.dataset.act==="menu")openDrawer();else back();return}
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go,g.dataset.p?JSON.parse(g.dataset.p):{},{root:!!g.dataset.root});return}
  const pk=e.target.closest("[data-pick]");if(pk){go("pick",{pid:pk.dataset.pick,step:2});return}
  const kt=e.target.closest("[data-kit]");if(kt){toggleKit(kt.dataset.kit);return}
  const o=e.target.closest("[data-open]");if(o&&!o.closest("#sheet"))openSheet(o.dataset.open);
});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("#sheet").hidden)closeSheet();else if(!$("#drawer").hidden)closeDrawer()});

/* ---------- 프로그램 카드 ---------- */
function matches(t){
  if(state.season&&t.season!==state.season)return false;
  if(state.area&&t.area!==state.area)return false;
  if(!state.q)return true;
  const hay=[...t.kinds,t.title,t.tech,t.area,t.season,...t.books.flatMap(b=>[b.t,b.a]),...t.mats.map(m=>m.n)].join(" ").toLowerCase();
  return hay.includes(state.q);
}
function selectBtn(t){
  if(canCourse()&&courseList().length)return `<button class="btn primary small" type="button" data-pick="${esc(t.id)}" aria-label="${esc(t.title)} 수업에 넣기">선택</button>`;
  const inKit=state.kit.includes(t.id);
  return `<button class="btn small ${inKit?"":"primary"}" type="button" data-kit="${esc(t.id)}">${inKit?"키트에 담김":"키트에 담기"}</button>`;
}
function pcardHTML(t){
  const b=t.books[0];const inKit=state.kit.includes(t.id);
  return `<article class="pcard">
    <button class="pc-open" type="button" data-open="${esc(t.id)}">
      <span class="pc-art" style="--c:${t.color}">${t.images[0]?`<img src="${imgSrc(t.images[0])}" alt="" loading="lazy" onerror="this.remove()">`:`<span aria-hidden="true">${esc(t.icon||"🎨")}</span>`}${inKit?'<span class="kitbadge">키트</span>':""}</span>
      <span class="pc-tx"><b>${esc(t.title||"제목 없음")}${t._src==="custom"?'<span class="srcmark">직접 추가</span>':t._src==="edited"?'<span class="srcmark">수정됨</span>':""}</b>
        <small>${b&&b.t?`『${esc(b.t)}』 ${esc(b.a)} · `:""}${esc(t.tech)}</small>
        <span class="kinds">${t.kinds.map(k=>`<span>${esc(k)}</span>`).join("")}</span></span>
    </button>
    <div class="pc-foot"><span class="meta">${esc(t.age)} · ${esc(t.time)}분 · 재료 ${t.mats.length}가지</span>${selectBtn(t)}</div>
  </article>`;
}
function renderResults(){
  const box=$("#results");if(!box)return;
  const list=themes().filter(matches);const ks=state.kinds;
  if(ks.length){
    const full=list.filter(t=>ks.every(k=>t.kinds.includes(k)));
    const part=ks.length>1?list.filter(t=>!full.includes(t)&&ks.some(k=>t.kinds.includes(k))):[];
    box.innerHTML=`<div class="combo"><div class="combohead"><b>${ks.length>1?"재료 조합":"재료"}</b><span class="combochips">${ks.map((k,i)=>`${i?'<span class="plus">+</span>':""}<button class="cchip" type="button" data-unk="${esc(k)}" aria-label="${esc(k)} 빼기">${esc(k)} ×</button>`).join("")}</span><button class="btn small" type="button" id="comboClear">지우기</button></div>
      <p class="note">${ks.length>1?`${ks.map(esc).join(" + ")}을 모두 쓰는 프로그램 ${full.length}개`:`${esc(ks[0])} 프로그램 ${full.length}개 · 재료를 하나 더 고르면 조합으로 찾아줘요`}</p></div>
      ${full.length?`<div class="plist">${full.map(pcardHTML).join("")}</div>`:`<div class="empty">이 조합으로 된 프로그램이 아직 없어요.${cap.canEdit?` <button class="btn small primary" type="button" id="comboNew">이 조합으로 새 프로그램 만들기</button>`:""}</div>`}
      ${part.length?`<h2 class="ghead">일부만 맞는 프로그램 <span class="cnt">${part.length}</span></h2><div class="plist">${part.map(pcardHTML).join("")}</div>`:""}`;
    box.querySelectorAll("[data-unk]").forEach(b=>b.onclick=()=>{state.kinds=state.kinds.filter(x=>x!==b.dataset.unk);syncKindChips();renderResults()});
    $("#comboClear").onclick=()=>{state.kinds=[];syncKindChips();renderResults()};
    if($("#comboNew"))$("#comboNew").onclick=()=>newTheme([...ks,"그림책"]);
    return;
  }
  const head=`<div class="resbar"><span class="note">프로그램 ${list.length}개${state.season||state.area||state.q?" · 거르는 중":""}</span><button class="chip" type="button" id="groupToggle" aria-pressed="${state.group}">재료별로 묶기</button></div>`;
  if(!list.length)box.innerHTML=head+`<div class="empty">조건에 맞는 프로그램이 없어요. 거르기를 풀거나 다른 단어로 찾아보세요.</div>`;
  else if(state.group){
    const groups={};list.forEach(t=>(groups[mainKind(t)]=groups[mainKind(t)]||[]).push(t));

}
function syncKindChips(){$$("[data-k]").forEach(x=>x.setAttribute("aria-pressed",String(state.kinds.includes(x.dataset.k))))}

function monthBooks(){
  const now=new Date();const ym=dstr(now).slice(0,7);const all=themes();const seen=new Set();const out=[];
  courseList().forEach(c=>c.sessions.forEach(s=>{if((s.date||"").startsWith(ym)){const t=all.find(x=>x.id===s.programId);if(t&&!seen.has(t.id)&&t.books.some(b=>b.t)){seen.add(t.id);out.push({t,why:`${c.name} · ${fmtShort(s.date)} 수업`})}}}));
  const season=["겨울","겨울","봄","봄","봄","여름","여름","여름","가을","가을","가을","겨울"][now.getMonth()];
  all.filter(t=>t.season===season&&!seen.has(t.id)&&t.books.some(b=>b.t)).forEach(t=>{seen.add(t.id);out.push({t,why:`${season} 추천`})});
  return{out,season,month:now.getMonth()+1};
}

  cEdit={id:"k-"+Date.now().toString(36),name:"",kids:10,memo:"",sessions:[],_new:true,gen:{start:start&&start>=todayStr()?start:addDays(todayStr(),1),every:7,count:4}};
  cConfirmDel=false;go("cedit");
}

}

pick:{html(p){
  const step=p.step||1;const list=courseList();
  const steps=`<div class="stepper">${["고르기","날짜","확인"].map((l,k)=>`<span class="${k+1===step?"on":k+1<step?"done":""}"><i>${k+1}</i>${l}</span>`).join("")}</div>`;
  const head=bar({title:step===3?"선택 확인":"프로그램 고르기",tone:"plain",body:steps});
  if(!canCourse())return head+`<div class="pad"><div class="empty">수업 일정은 편집 권한이 있는 사람만 바꿀 수 있어요.</div></div>`;
  if(step===1)return head+`<div class="pad stack"><label class="search">${ico.search}<input id="pq" type="search" value="${esc(p.q||"")}" placeholder="프로그램 이름, 그림책으로 찾기" aria-label="프로그램 찾기"></label><div class="plist" id="pickList">${pickList(pickFilter(p.q))}</div></div>`;
  const t=byId(p.pid);
  if(!t)return head+`<div class="pad"><div class="empty">프로그램을 찾지 못했어요.</div></div>`;
  if(!list.length)return head+`<div class="pad stack">${selCard(t)}<div class="empty">먼저 수업을 만들어 주세요.<button class="btn primary small" type="button" data-newcourse>+ 새 수업 만들기</button></div></div>`;
  if(step===2){
    const cid=p.cid&&getCourse(p.cid)?p.cid:(state.course&&getCourse(state.course)?state.course:list[0].id);
    const c=getCourse(cid);const last=[...c.sessions].reverse().find(s=>s.date)?.date;
    const date=p.date||(last?addDays(last,7):addDays(todayStr(),1));
    return head+`<div class="pad stack">${selCard(t)}
      <form class="form" id="pk2"><fieldset><legend>어느 수업, 어느 날에 할까요?</legend>
        <label class="fld"><span>수업</span><select id="pk-course">${list.map(x=>`<option value="${esc(x.id)}" ${x.id===cid?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label>
        <label class="fld"><span>날짜</span><input id="pk-date" type="date" value="${esc(date)}" required></label>
        <span class="hint">${last?`${esc(c.name)} 마지막 수업(${esc(fmtShort(last))}) 다음 주로 골라 뒀어요.`:"내일 날짜로 골라 뒀어요."}</span></fieldset>
        <button class="btn navy block" type="submit">다음</button></form></div>`;
  }
  const c=getCourse(p.cid);if(!c)return head+`<div class="pad"><div class="empty">수업을 찾지 못했어요.</div></div>`;
  const replacing=p.i!=null&&c.sessions[p.i];
  const wk=replacing?p.i+1:c.sessions.filter(s=>s.date&&s.date<=p.date).length+1;
  const memo=p.memo??(replacing?c.sessions[p.i].memo||"":"");
  return head+`<div class="pad stack">${selCard(t,`${esc(c.name)} · ${wk}주차 · ${esc(fmtD(replacing?c.sessions[p.i].date:p.date))}`)}
    <section class="stack-s"><h3 class="sec-t">수업 장소</h3><div class="mapbox">${svg.map}<span class="place">${esc(c.memo||c.name)}</span></div></section>
    <label class="fld"><span class="sec-t">메모</span><textarea id="pk-memo" rows="3" placeholder="예: 검정 도화지는 전날 미리 잘라 두기">${esc(memo)}</textarea></label>
    <div class="countrow"><span><small>이번 주 준비물</small><b>${t.mats.length}가지</b></span><button class="btn navy wide" type="button" id="pkSave">저장하고 준비물 보기</button></div>
  </div>`},
  bind(p){
    $$("[data-newcourse]").forEach(b=>b.onclick=()=>newCourse());
    if($("#pq")){$("#pq").oninput=e=>{route.p={...route.p,q:e.target.value};$("#pickList").innerHTML=pickList(pickFilter(e.target.value));bindChoose()};bindChoose()}
    if($("#pk2")){
      $("#pk-course").onchange=e=>{route.p={...route.p,cid:e.target.value,date:undefined};draw()};
      $("#pk2").onsubmit=e=>{e.preventDefault();const date=$("#pk-date").value;if(!parseD(date)){toast("날짜를 골라 주세요");return}
        go("pick",{...route.p,cid:$("#pk-course").value,date,step:3})};
    }
    if($("#pkSave")){
      $("#pk-memo").oninput=e=>{route.p={...route.p,memo:e.target.value}};
      $("#pkSave").onclick=async()=>{
        const c=getCourse(p.cid);const t=byId(p.pid);if(!c||!t)return;
        const memo=$("#pk-memo").value.trim();const replacing=p.i!=null&&c.sessions[p.i];
        const clean=s=>({date:s.date||"",programId:s.programId||"",memo:s.memo||"",packed:s.packed||{}});
        let sessions,idx;
        if(replacing){sessions=c.sessions.map((s,j)=>clean(j===p.i?{...s,programId:t.id,memo,packed:s.programId===t.id?s.packed:{}}:s));idx=p.i}
        else{const ns={date:p.date,programId:t.id,memo,packed:{}};sessions=[...c.sessions.map(clean),ns].sort((a,b)=>!a.date?1:!b.date?-1:a.date.localeCompare(b.date));idx=sessions.indexOf(ns)}
        $("#pkSave").disabled=true;
        try{await putCourse(c.id,{...plain(c),sessions});toast(`${c.name} ${idx+1}주차에 넣었어요`);
          while(hist.length&&hist[hist.length-1].name==="pick")hist.pop();
          go("week",{cid:c.id,i:idx},{replace:true});
        }catch(err){saveError(err);$("#pkSave").disabled=false}
      };
    }
  }},

kit:{html(){
  return bar({title:"키트 준비 목록",left:"menu"})+`<div class="pad stack">
    <section class="card-w stack-s"><h2 class="sec-t">담은 프로그램 <span class="cnt" id="kitCount">0</span></h2><ul class="kitlist" id="kitlist"></ul>
      <div class="kids"><label for="kids">아이 수</label><span class="stepper2"><button type="button" id="minus" aria-label="한 명 줄이기">−</button><input id="kids" type="number" min="1" max="200" inputmode="numeric"><button type="button" id="plus" aria-label="한 명 늘리기">+</button></span><span class="note">명 기준으로 계산</span></div></section>
    <section class="card-w stack-s"><div class="rowhead"><h2 class="sec-t">준비물 합계</h2><button class="btn small" id="copy" type="button">목록 복사</button></div><div id="totals"></div></section>
  </div>`},
  bind(){
    $("#kitlist").onclick=e=>{const b=e.target.closest("[data-rm]");if(b)toggleKit(b.dataset.rm)};
    $("#totals").onchange=e=>{const c=e.target.closest("input[data-key]");if(!c)return;
      if(c.checked)state.done[c.dataset.key]=true;else delete state.done[c.dataset.key];store.set("done",state.done);renderKit()};
    $("#kids").onchange=e=>setKids(e.target.value);
    $("#minus").onclick=()=>setKids(state.kids-1);$("#plus").onclick=()=>setKids(state.kids+1);
    $("#copy").onclick=()=>{const {per,shared}=totals();const k=state.kids;
      const titles=state.kit.map(byId).filter(Boolean).map(t=>`- ${t.title}${t.books[0]?.t?` (『${t.books[0].t}』)`:""}`);
      copyText(["[미술키트 준비 목록] 아이 "+k+"명","","프로그램",...titles,"","아이별 준비물",...per.map(m=>`- ${m.n}: ${+(m.q*k).toFixed(1)} ${m.u}`),"","반 공용",...shared.map(m=>`- ${m.n}`)].join("\n"),"목록을 복사했어요")};
    renderKit();
  }},

cedit:{html(){return bar({title:cEdit?._new?"새 수업 만들기":"수업 편집",tone:"plain"})+`<div class="pad"><div id="cdetail"></div></div>`},
  bind(){if(!cEdit){setTimeout(back,0);return}renderCourseEditor()}}

function pickFilter(q){q=(q||"").trim().toLowerCase();return themes().filter(t=>!q||[t.title,t.tech,...t.kinds,...t.books.flatMap(b=>[b.t,b.a])].join(" ").toLowerCase().includes(q))}
function bindChoose(){$$("[data-choose]").forEach(b=>b.onclick=()=>{const p=route.p;const c=p.cid&&getCourse(p.cid);
  if(c&&p.i!=null&&c.sessions[p.i])go("pick",{...p,pid:b.dataset.choose,step:3});else go("pick",{...p,pid:b.dataset.choose,step:2})})}

function courseInfo(c,all,ni){
  const t0=todayStr();const past=c.sessions.filter(s=>s.date&&s.date<t0).length;
  const from=ni>=0?ni:Math.max(0,c.sessions.length-3);const show=c.sessions.slice(from,from+3);
  const ns=c.sessions[ni];const np=ns&&all.find(t=>t.id===ns.programId);
  const packN=np?np.mats.filter(m=>(ns.packed||{})[matKey(m)]).length:0;
  const ids=c.sessions.map(s=>s.programId).filter(id=>all.some(t=>t.id===id));const {per,shared}=totals(ids);
  return `<div class="cname"><h2>${esc(c.name)}</h2>${c.memo?`<small>${esc(c.memo)}</small>`:""}</div>
    ${show.length?`<div class="wktiles">${show.map((s,k)=>{const i=from+k;const t=all.find(x=>x.id===s.programId);const on=i===ni;
      return `<button class="wktile" type="button" data-go="week" data-p="${dp({cid:c.id,i})}" style="--tone:${on?"var(--navy)":toneVar(i)};--tt:${on?"var(--on-navy)":"var(--on-tile)"}"><span>${i+1}주차</span><small>${esc(fmtShort(s.date))}${on?" · 다음":""}</small><span class="wkico" aria-hidden="true">${t?esc(t.icon):"?"}</span></button>`}).join("")}</div>`:""}
    <section class="card-w"><h3 class="sec-t">${ns?`다음 수업 준비 현황 · ${ni+1}주차`:"수업 준비 현황"}</h3>
      <div class="prog3"><span><small>진행</small><b>${past}/${c.sessions.length}</b><small>주차</small></span><span><small>챙긴 재료</small><b>${np?`${packN}/${np.mats.length}`:"–"}</b><small>가지</small></span><span><small>활동</small><b>${np?esc(np.time):"–"}</b><small>분</small></span></div></section>
    <div class="stack-s">
      ${ns?`<button class="rowlink" type="button" data-go="week" data-p="${dp({cid:c.id,i:ni})}">이번 주 준비물 보기 <span aria-hidden="true">›</span></button>`:""}
      ${canCourse()?`<button class="rowlink" type="button" id="cEditBtn">수업 정보 수정 <span aria-hidden="true">›</span></button>`:""}
      <button class="rowlink" type="button" id="cCopy">일정 복사 <span aria-hidden="true">›</span></button>
      ${cap.dl||standalone()?`<button class="rowlink" type="button" id="cExport">수업 계획서 내보내기 <span>워드 파일 ›</span></button>`:""}
      ${ids.length?`<details class="rowdet"><summary class="rowlink">이 수업 전체 준비물 <span>${ids.length}회분 · 아이 ${c.kids}명 ▾</span></summary>
        <div class="card-w tblwrap"><table class="tot"><tbody>${per.map(m=>`<tr><td>${esc(m.n)}<div class="from">${esc([...new Set(m.from)].join(", "))}</div></td><td class="n">${+(m.q*c.kids).toFixed(1)} ${esc(m.u)}</td></tr>`).join("")}
        ${shared.map(m=>`<tr><td>${esc(m.n)}<div class="from">${esc([...new Set(m.from)].join(", "))}</div></td><td class="n">공용</td></tr>`).join("")}</tbody></table></div></details>`:""}
    </div>`;
}
function courseWeeks(c,all,ni){
  const t0=todayStr();
  return `<div class="datestrip">${c.sessions.map((s,i)=>{const d=parseD(s.date);return `<button class="dchip" type="button" data-go="week" data-p="${dp({cid:c.id,i})}" aria-current="${i===ni}" aria-label="${i+1}주차 ${esc(fmtD(s.date))}"><b>${d?d.getDate():"?"}</b><small>${d?DOW[d.getDay()]:"미정"}</small></button>`}).join("")}</div>
    ${c.sessions.length?c.sessions.map((s,i)=>{const t=all.find(x=>x.id===s.programId);const past=s.date&&s.date<t0;
      return `<button class="bigweek ${past?"past":""}" type="button" data-go="week" data-p="${dp({cid:c.id,i})}" style="--tone:${toneVar(i)}"><span class="bw-top"><b>${i+1}주차 · ${esc(t?t.title:"프로그램 미정")}</b>${i===ni?'<span class="tag">다음 수업</span>':past?'<span class="tag">지난 수업</span>':""}</span><small>${esc(c.name)}${t?.books[0]?.t?` · 『${esc(t.books[0].t)}』`:""}</small><small class="when">${esc(fmtD(s.date))}${s.memo?` · ${esc(s.memo)}`:""}</small></button>`}).join("")
      :`<p class="note">아직 주차가 없어요.</p>`}
    ${canCourse()?`<button class="addweek" type="button" data-go="pick" data-p="${dp({cid:c.id,step:1})}">${ico.plus} 새 주차 추가</button>`:""}`;
}

function openSheet(id,shot=0){
  const all=themes();const t=all.find(x=>x.id===id);if(!t){closeSheet();return}
  if(state.open!==id)extraSel=new Set();
  state.open=id;state.shot=Math.min(shot,Math.max(0,t.images.length-1));
  const inKit=state.kit.includes(id);const rel=relatedOf(t,all);
  $("#sheet").innerHTML=`
    <div class="hero2"><button class="close" type="button" id="closeSheet" aria-label="닫기">✕</button>${picHTML(t,state.shot)}</div>
    ${t.images.length>1?`<div class="thumbs">${t.images.map((im,i)=>`<button type="button" data-shot="${i}" aria-current="${i===state.shot}" aria-label="사진 ${i+1}"><img src="${imgSrc(im)}" alt=""></button>`).join("")}</div>`:""}
    <div class="headline">
      <span class="tags">${t.kinds.map(k=>`<span class="k">${esc(k)}</span>`).join("")}<span>${esc(t.season)}</span><span>${esc(t.area)}</span><span>${esc(t.age)}</span><span>활동 ${esc(t.time)}분</span></span>
      <h2 id="sheetTitle">${esc(t.title)}</h2><div class="tech">${esc(t.tech)}</div>
    </div>
    ${t.books.filter(b=>b.t).length?`<div class="sec"><h3>연계 그림책</h3>
      ${t.books.filter(b=>b.t).map(b=>{const y=ytHref(b);return `<div class="bookbox"><span class="t">『${esc(b.t)}』</span><span class="a">${esc(b.a)}</span>${b.n?`<span class="n">${esc(b.n)}</span>`:""}
        <a class="ytlink" href="${esc(y.href)}" target="_blank" rel="noopener">${y.label}${y.direct?"":" <small>읽어주기 영상</small>"}</a></div>`}).join("")}</div>`:""}
    ${t.steps.length?`<div class="sec"><h3>활동 순서</h3><ol class="steps">${t.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>`:""}
    ${t.mats.length?`<div class="sec"><h3>키트 준비물 <span class="note">아이 1명 기준</span></h3>
      <ul class="mats">${t.mats.map(m=>`<li><span>${esc(m.n)}</span><span class="q">${+m.q?esc(m.q)+" "+esc(m.u):"반 공용"}</span></li>`).join("")}</ul></div>`:""}
    ${t.ideas.length?`<div class="sec"><h3>이 프로그램으로 더 해볼 것</h3><ul class="ideas">${t.ideas.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>`:""}
    ${t.tip?`<div class="sec"><div class="tip"><b>교사 팁</b> · ${esc(t.tip)}</div></div>`:""}
    <div class="sec" id="planner"></div>
    ${rel.length?`<div class="sec"><h3>비슷한 연계 수업</h3><div class="related">${rel.map(r=>`<button class="rel" type="button" data-rel="${esc(r.t.id)}">${miniHTML(r.t)}<span class="tx"><b>${esc(r.t.title)}</b><small>『${esc(r.t.books[0]?.t||"")}』 · ${esc(r.t.tech)}</small><span class="why">${esc(r.why)}</span></span></button>`).join("")}</div></div>`:""}
    <div class="actions">
      <button class="btn primary grow ${inKit?"on":""}" type="button" id="toggleKit">${inKit?"키트에서 빼기":"키트에 담기"}</button>
      ${canCourse()?`<button class="btn navy" type="button" id="toCourse">수업에 넣기</button>`:""}
      ${cap.canEdit?`<button class="btn" type="button" id="editThis">수정</button>`:""}
      <button class="btn" type="button" id="closeSheet2">닫기</button>
    </div>`;
  if($("#sheet").hidden){$("#sheet").hidden=false;$("#scrim").hidden=false;$("#sheet").scrollTop=0;$("#closeSheet").focus()}
  $("#closeSheet").onclick=$("#closeSheet2").onclick=closeSheet;
  $("#toggleKit").onclick=()=>toggleKit(id);
  if($("#toCourse"))$("#toCourse").onclick=()=>{closeSheet();go("pick",{pid:id,step:2})};
  if($("#editThis"))$("#editThis").onclick=()=>{closeSheet();editTheme(id)};
  renderPlanner(t);
  $("#sheet").querySelectorAll("[data-rel]").forEach(b=>b.onclick=()=>{openSheet(b.dataset.rel);$("#sheet").scrollTop=0});
  $("#sheet").querySelectorAll("[data-shot]").forEach(b=>b.onclick=()=>{const y=$("#sheet").scrollTop;openSheet(id,+b.dataset.shot);$("#sheet").scrollTop=y});
}
function openWithExtra(pid,key){
  const t=byId(pid);if(!t)return;openSheet(pid);extraSel=new Set([key]);renderPlanner(t);
  const pl=$("#planner");if(pl)$("#sheet").scrollTop=pl.offsetTop-12;
}
function planOf(t){
  const ex=extrasOf(t);const b=t.books.find(x=>x.t)?.t;
  const flow=[
    {min:5,title:"도입",desc:b?`『${b}』 표지를 보고 무슨 이야기일지 예상하기`:"오늘 만들 작품과 관련된 경험 이야기 나누기"},
    ...(b?[{min:8,title:"그림책 읽기",desc:`『${b}』 함께 읽기`}]:[]),
    {min:+t.time||30,title:"미술 활동",desc:t.tech||t.title},
    ...ex.filter(e=>extraSel.has(e.key)).map(e=>({min:e.min,title:e.title,desc:e.desc,plus:true})),
    {min:WRAP_MIN,title:"정리",desc:"작품 소개하고 함께 정리하기"}];
  const base=flow.filter(f=>!f.plus).reduce((s,f)=>s+f.min,0);
  const total=flow.reduce((s,f)=>s+f.min,0);
  return{ex,flow,base,total};
}
function autoPick(t,add){
  const ex=extrasOf(t).slice().sort((a,b)=>(a.tag==="그림책"?0:1)-(b.tag==="그림책"?0:1));
  extraSel=new Set();let left=add;
  ex.forEach(e=>{if(e.min<=left){extraSel.add(e.key);left-=e.min}});
}
function renderPlanner(t){
  const box=$("#planner");if(!box)return;
  const {ex,flow,base,total}=planOf(t);const plus=total-base;
  box.innerHTML=`
    <h3>수업 시간 늘리기</h3>
    <p class="note">기본 수업은 ${base}분이에요. 시간이 더 있으면 버튼을 누르거나 아래 활동을 직접 골라 주세요.</p>
    <div class="chiprow">${[0,10,20,30,40].map(m=>`<button class="chip" type="button" data-add="${m}" aria-pressed="${plus===m}">${m?"+"+m+"분":"기본만"}</button>`).join("")}</div>
    <ul class="extras">${ex.map(e=>`<li><label><input type="checkbox" data-ex="${esc(e.key)}" ${extraSel.has(e.key)?"checked":""}>

function toggleKit(id){

  if(i>=0){state.kit.splice(i,1);toast("키트에서 뺐어요")}else{state.kit.push(id);toast("키트에 담았어요")}
  store.set("kit",state.kit);refresh();
}
function totals(ids=state.kit){
  const per={},shared={};
  ids.forEach(id=>{const t=byId(id);if(!t)return;
    t.mats.forEach(({n,q,u})=>{q=+q||0;const bucket=q?per:shared;const key=n+"|"+(q?u:"");
      bucket[key]=bucket[key]||{n,u,q:0,from:[],key};bucket[key].q+=q;bucket[key].from.push(t.title)})});
  const s=o=>Object.values(o).sort((a,b)=>a.n.localeCompare(b.n,"ko"));
  return{per:s(per),shared:s(shared)};
}
function renderKit(){
  if(!$("#totals"))return;

  $("#kitCount").textContent=items.length;
  $("#kitlist").innerHTML=items.length?items.map(t=>`<li>${miniHTML(t)}<span class="nm">${esc(t.title)}<small>${t.books[0]?.t?`『${esc(t.books[0].t)}』 · `:""}${esc(t.tech)}</small></span><button class="x" type="button" data-rm="${esc(t.id)}" aria-label="${esc(t.title)} 빼기">×</button></li>`).join(""):
    `<li class="note">아직 담은 프로그램이 없어요. 프로그램 카드를 열고 ‘키트에 담기’를 누르세요.<button class="btn small primary" type="button" data-go="browse" data-root="1">프로그램 찾기</button></li>`;
  $("#kids").value=state.kids;
  const {per,shared}=totals();const k=state.kids;
  if(!items.length){$("#totals").innerHTML=`<p class="note">프로그램을 담으면 아이 수에 맞춰 준비물이 합산돼요.</p>`;return}
  const row=(m,qty)=>{const d=!!state.done[m.key];
    return `<tr class="${d?"done":""}"><td class="c"><input type="checkbox" data-key="${esc(m.key)}" ${d?"checked":""} aria-label="${esc(m.n)} 준비 완료"></td><td>${esc(m.n)}<div class="from">${esc([...new Set(m.from)].join(", "))}</div></td><td class="n">${esc(qty)}</td></tr>`};
  $("#totals").innerHTML=`

async function shrink(file){
  try{
    if(file.type==="image/gif")return file;
    const bmp=await createImageBitmap(file);const max=1600;const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
    if(s===1&&file.size<1.5e6)return file;
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.85));
  }catch(e){return file}
}
async function uploadFiles(files){
  if(!cap.assets||!files.length)return;
  syncForm();
  const lab=$("#upLabel");if(lab)lab.querySelector("span").textContent="올리는 중…";
  for(const f of files){
    try{const blob=await shrink(f);const r=await cap.assets.upload(blob,{type:blob.type||f.type});draft.images.push(r.id);uploadedNow.push(r.id)}
    catch(err){const c=err&&err.code;toast(c==="too_large"?"사진이 너무 커요(20MB 이하)":c==="unsupported_type"?"PNG, JPG, WEBP, GIF 사진만 올릴 수 있어요":c==="quota_or_state"?"저장 공간이 가득 찼어요. 안 쓰는 사진을 지워 주세요":"사진을 올리지 못했어요. 잠시 뒤 다시 시도해 주세요")}
  }
  renderImgs();
}

    steps:v("#f-steps").split("\n").map(s=>s.trim()).filter(Boolean),ideas:v("#f-ideas").split("\n").map(s=>s.trim()).filter(Boolean),tip:v("#f-tip").trim(),

      .map(p=>isNaN(+p[0])?{min:10,title:p[0],desc:p[1]||""}:{min:Math.max(5,Math.min(120,+p[0]||10)),title:p[1],desc:p[2]||""})});

  draft.mats=[...$("#mats").querySelectorAll(".matrow")].map(r=>{const sh=r.querySelector("[data-k=shared]").checked;const g=k=>r.querySelector(`[data-k=${k}]`).value.trim();
    return sh?{n:g("n"),q:0,u:"공용"}:{n:g("n"),q:Math.max(0,parseFloat(g("q"))||1),u:g("u")||"개"}});
}
async function saveDraft(){
  syncForm();
  if(!draft.title){toast("프로그램 이름을 적어 주세요");$("#f-title").focus();return}
  const bad=draft.books.find(b=>b.yt&&!/^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//i.test(b.yt));
  if(bad){toast("유튜브 링크는 https://www.youtube.com 또는 https://youtu.be 로 시작해야 해요");return}
  if(!draft.kinds.length){toast("수업 종류를 하나 이상 골라 주세요");return}
  const body={kinds:draft.kinds,title:draft.title,icon:draft.icon,season:draft.season,area:draft.area,color:draft.color,tech:draft.tech,age:draft.age,time:draft.time,
    books:draft.books.filter(b=>b.t),steps:draft.steps,mats:draft.mats.filter(m=>m.n),ideas:draft.ideas,tip:draft.tip,extras:draft.extras,images:draft.images,related:draft.related,updatedAt:new Date().toISOString()};
  const btn=$("#saveBtn");btn.disabled=true;btn.textContent="저장 중…";
  try{
    await cap.db.collection("themes").doc(draft.id).set(body);
    const removed=(draft._orig||[]).filter(id=>!draft.images.includes(id));
    removed.forEach(id=>cap.assets&&cap.assets.delete(id).catch(()=>{}));
    uploadedNow=[];
    toast("저장했어요");const id=draft.id;draft=null;
    setTimeout(()=>editTheme(id),0);
  }catch(err){saveError(err);btn.disabled=false;btn.textContent="저장"}
}
async function deleteDraft(){
  const d=draft;
  try{
    if(DEFAULT_IDS.has(d.id))await cap.db.collection("themes").doc(d.id).set({deleted:true,updatedAt:new Date().toISOString()});
    else await cap.db.collection("themes").doc(d.id).delete();
    if(cap.assets)[...(d._orig||[]),...uploadedNow].forEach(id=>cap.assets.delete(id).catch(()=>{}));
    uploadedNow=[];
    state.kit=state.kit.filter(x=>x!==d.id);store.set("kit",state.kit);
    toast(DEFAULT_IDS.has(d.id)?"삭제했어요. 목록 아래에서 되살릴 수 있어요":"삭제했어요");draft=null;renderEditor();renderMList();
  }catch(err){saveError(err)}
}
function saveError(err){
  const c=err&&err.code;
  toast(c==="invalid_argument"||c==="permission_denied"?"이 페이지를 고칠 권한이 없어요":c==="quota_exceeded"?"저장 공간이 가득 찼어요":"저장하지 못했어요. 잠시 뒤 다시 시도해 주세요");
}

/* ---------- 수업 편집 ---------- */
function progOptions(sel){
  const g={};themes().forEach(t=>(g[mainKind(t)]=g[mainKind(t)]||[]).push(t));
  return `<option value="">프로그램 고르기</option>`+allKinds().filter(k=>g[k]).map(k=>`<optgroup label="${esc(k)}">${g[k].map(t=>`<option value="${esc(t.id)}" ${t.id===sel?"selected":""}>${esc(t.title)}${t.books[0]?.t?` · 『${esc(t.books[0].t)}』`:""}</option>`).join("")}</optgroup>`).join("");
}
function syncCourseForm(){
  if(!cEdit||!$("#cform"))return;
  cEdit.name=$("#c-name").value.trim();cEdit.kids=Math.max(1,Math.min(200,parseInt($("#c-kids").value)||10));cEdit.memo=$("#c-memo").value.trim();
  cEdit.gen={start:$("#g-start").value,every:+$("#g-every").value||7,count:Math.max(1,Math.min(52,parseInt($("#g-count").value)||4))};
  cEdit.sessions=[...$("#srows").querySelectorAll(".srow")].map((r,i)=>({...cEdit.sessions[i],date:r.querySelector("[data-f=date]").value,programId:r.querySelector("[data-f=prog]").value,memo:r.querySelector("[data-f=memo]").value.trim()}));
}
function renderCourseEditor(){
  const c=cEdit;const box=$("#cdetail");if(!box||!c)return;
  box.innerHTML=`
    <form class="form" id="cform" autocomplete="off">
      <fieldset><legend>수업 정보</legend>
        <div class="row">
          <label class="fld" style="grid-column:1/-1"><span>수업 이름 (기관·반)</span><input id="c-name" value="${esc(c.name)}" placeholder="예: 범어 도서관 토요 미술"></label>
          <label class="fld"><span>아이 수</span><input id="c-kids" type="number" min="1" max="200" value="${esc(c.kids)}"></label>
          <label class="fld" style="grid-column:1/-1"><span>장소·시간 메모</span><input id="c-memo" value="${esc(c.memo||"")}" placeholder="예: 토 10:30, 2층 문화교실"></label>
        </div>
      </fieldset>
      <fieldset><legend>날짜 한 번에 만들기</legend>
        <div class="row">
          <label class="fld"><span>첫 수업 날짜</span><input id="g-start" type="date" value="${esc(c.gen.start)}"></label>
          <label class="fld"><span>반복</span><select id="g-every">${[[7,"매주"],[14,"격주"],[1,"매일"]].map(([v,l])=>`<option value="${v}" ${+c.gen.every===v?"selected":""}>${l}</option>`).join("")}</select></label>
          <label class="fld"><span>몇 주차까지</span><input id="g-count" type="number" min="1" max="52" value="${esc(c.gen.count)}"></label>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn small" type="button" id="genDates">날짜 채우기</button>
          ${state.kit.length?`<button class="btn small" type="button" id="fillKit">키트에 담은 프로그램 ${state.kit.length}개 순서대로 넣기</button>`:""}
        </div>
        <span class="hint">‘날짜 채우기’는 고른 프로그램은 그대로 두고 주차 수와 날짜만 맞춰요.</span>
      </fieldset>
      <fieldset><legend>주차별 프로그램</legend>
        <div id="srows" style="display:grid;gap:6px">${c.sessions.map((s,i)=>`<div class="srow">

          <input class="sm" data-f="memo" value="${esc(s.memo||"")}" placeholder="이 주차 메모 (선택)" aria-label="${i+1}주차 메모">
        </div>`).join("")||`<p class="note">아직 주차가 없어요. 위에서 ‘날짜 채우기’를 누르거나 아래 버튼으로 하나씩 추가하세요.</p>`}</div>
        <button class="btn small" type="button" id="addWeek" style="justify-self:start">+ 주차 추가</button>
      </fieldset>

  $("#genDates").onclick=()=>{syncCourseForm();const g=cEdit.gen;if(!parseD(g.start)){toast("첫 수업 날짜를 골라 주세요");return}
    const s=[];for(let i=0;i<g.count;i++)s.push({...(cEdit.sessions[i]||{programId:"",memo:"",packed:{}}),date:addDays(g.start,i*g.every)});cEdit.sessions=s;renderCourseEditor()};
  if($("#fillKit"))$("#fillKit").onclick=()=>{syncCourseForm();const g=cEdit.gen;const ids=state.kit.filter(id=>byId(id));
    ids.forEach((id,k)=>{if(cEdit.sessions[k])cEdit.sessions[k].programId=id;else cEdit.sessions.push({programId:id,memo:"",packed:{},date:parseD(g.start)?addDays(g.start,k*g.every):""})});renderCourseEditor();toast(`${ids.length}개를 1주차부터 넣었어요`)};
  $("#addWeek").onclick=()=>{syncCourseForm();const last=[...cEdit.sessions].reverse().find(s=>s.date)?.date;
    cEdit.sessions.push({date:last?addDays(last,+cEdit.gen.every||7):(cEdit.gen.start||""),programId:"",memo:"",packed:{}});renderCourseEditor()};
  box.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{syncCourseForm();const i=+b.dataset.up;const s=cEdit.sessions;[s[i-1].programId,s[i].programId]=[s[i].programId,s[i-1].programId];[s[i-1].memo,s[i].memo]=[s[i].memo,s[i-1].memo];renderCourseEditor()});
  box.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>{syncCourseForm();const i=+b.dataset.down;const s=cEdit.sessions;[s[i+1].programId,s[i].programId]=[s[i].programId,s[i+1].programId];[s[i+1].memo,s[i].memo]=[s[i].memo,s[i+1].memo];renderCourseEditor()});
  box.querySelectorAll("[data-rmw]").forEach(b=>b.onclick=()=>{syncCourseForm();cEdit.sessions.splice(+b.dataset.rmw,1);renderCourseEditor()});
  $("#cCancel").onclick=()=>{cEdit=null;back()};
  if($("#cDel"))$("#cDel").onclick=async()=>{if(!cConfirmDel){syncCourseForm();cConfirmDel=true;renderCourseEditor();return}
    try{const id=cEdit.id;cEdit=null;await dropCourse(id);state.course=null;toast("수업을 삭제했어요");go("course",{},{root:true})}catch(err){saveError(err)}};
  $("#cform").onsubmit=async e=>{e.preventDefault();syncCourseForm();
    if(!cEdit.name){toast("수업 이름을 적어 주세요");$("#c-name").focus();return}

      .sort((a,b)=>!a.date?1:!b.date?-1:a.date.localeCompare(b.date));
    const id=cEdit.id;const body={...plain(cEdit),sessions};
    try{cEdit=null;state.course=id;store.set("course",id);await putCourse(id,body);toast("수업을 저장했어요");go("course",{id,tab:"weeks"},{root:true})}catch(err){saveError(err)}};
}

/* 수업 계획서를 워드 파일로 저장 (한글에서도 열려요) */
async function exportCourse(c){
  const btn=$("#cExport");if(btn)btn.disabled=true;
  try{
    if(!window.JSZip)throw{code:"nolib"};
    const progs={};themes().forEach(t=>progs[t.id]=t);
    const blob=await courseDocx(window.JSZip,c,progs,todayStr()).generateAsync({type:"blob",compression:"DEFLATE"});
    const name=((c.name||"수업").replace(/[\\/:*?"<>|]/g," ").trim()||"수업")+" 수업 계획서.docx";
    if(window.AndroidBridge){   /* 휴대폰 앱(APK): 다운로드 폴더에 저장 */
      const b64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=no;r.readAsDataURL(blob)});
      window.AndroidBridge.saveFile(name,b64);return;
    }
    if(cap.dl)await cap.dl.save({filename:name,data:blob});
    else if(!standalone())throw{code:"unavailable"};
    else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},4000)}
    toast("수업 계획서 파일을 만들었어요");
  }catch(err){const k=err&&err.code;
    if(k==="declined")toast("저장을 취소했어요");
    else if(k==="rate_limited")toast("저장 창이 이미 열려 있어요. 잠시 뒤 다시 눌러 주세요");
    else if(k==="nolib")toast("파일 만드는 도구를 불러오지 못했어요. 새로고침해 주세요");
    else if(k==="extension_not_enabled"||k==="rejected_extension")toast("이 화면에서는 워드 파일을 저장할 수 없어요");
    else toast("파일을 저장하지 못했어요. 잠시 뒤 다시 시도해 주세요");
  }finally{const b=$("#cExport");if(b)b.disabled=false}
}

/* 휴대폰 앱(APK)의 뒤로 가기 버튼: 처리했으면 true */
window.__androidBack=()=>{
  if(!$("#sheet").hidden){closeSheet();return true}
  if(!$("#drawer").hidden){closeDrawer();return true}
  if(hist.length){back();return true}
  if(route.name!=="home"){go("home",{},{root:true});return true}
  return false;
};

/* 설치형 웹앱: GitHub Pages처럼 Claude 밖에서 열었을 때만 */
let installEvt=null;
const isInstalled=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const canOfferInstall=()=>standalone()&&!isInstalled()&&location.protocol==="https:";
if(standalone()&&"serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;refresh()});
window.addEventListener("appinstalled",()=>{installEvt=null;toast("앱을 설치했어요. 홈 화면 아이콘으로 열어 보세요");refresh()});
async function installApp(){
  closeDrawer();
  if(installEvt){const e=installEvt;installEvt=null;e.prompt();try{await e.userChoice}catch(err){}refresh();return}
  if(/iphone|ipad|ipod/i.test(navigator.userAgent))toast("사파리 아래쪽 공유 버튼 → ‘홈 화면에 추가’를 누르세요",6000);
  else toast("브라우저 메뉴(⋮)에서 ‘앱 설치’ 또는 ‘홈 화면에 추가’를 누르세요",6000);
}
document.addEventListener("click",e=>{if(e.target.closest("[data-install]"))installApp()});

let tt;function toast(m,ms=2400){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,ms)}

draw();

/* ---------- 공유 저장소 연결 ---------- */
(async()=>{
  if(!window.claude||!window.claude.use)return;
  window.claude.use("downloads").then(d=>{cap.dl=d;refresh()}).catch(()=>{});
  const db=await window.claude.use("db");
  if(!db)return;
  cap.db=db;courses={};
  db.collection("courses").onSnapshot(s=>{
    const o={};s.docs.forEach(d=>{const v=d.data();if(v)o[d.id]=v});courses=o;refresh();
  },()=>toast("수업 일정을 불러오지 못했어요. 새로고침해 주세요"));
  const user=await window.claude.use("user");
  cap.canEdit=user?await user.canEdit():false;
  if(cap.canEdit)cap.assets=await window.claude.use("assets");
  refresh();
  db.collection("themes").onSnapshot(s=>{
    const o={};s.docs.forEach(d=>{const v=d.data();if(v)o[d.id]=v});overrides=o;refresh();
  },()=>toast("저장된 수정 내용을 불러오지 못했어요. 새로고침해 주세요"));
})();
